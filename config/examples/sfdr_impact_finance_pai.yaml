# VeriGreen-ops Example Regulatory Rulebook (User-Editable)
# Aligns with EU Sustainable Finance Disclosure Regulation (SFDR) RTS
# Delegated Regulation (EU) 2022/1288 — Mandatory Principal Adverse Impact
# Indicators (PAI 1 through PAI 11).
#
# Seed into SQLite without wiping existing data:
#   python src/db.py seed --yaml config/examples/sfdr_impact_finance_pai.yaml

version: "2026.1"
active_frameworks:
  - EU_SFDR_PAI

requirements:
  - req_id: "SFDR-PAI-01"
    framework: "EU_SFDR_PAI"
    standard: "EU SFDR PAI 1"
    topic: "PAI 1 — GHG Emissions (Scope 1, 2, 3 & Total)"
    requirement_text: >
      Disclose financed Scope 1, Scope 2, Scope 3, and Total GHG emissions
      (tCO2e) attributable to investee companies using enterprise value
      including cash (EVIC) attribution and data coverage percentages.
    is_quantitative: true
    mandatory: true

  - req_id: "SFDR-PAI-02"
    framework: "EU_SFDR_PAI"
    standard: "EU SFDR PAI 2"
    topic: "PAI 2 — Carbon Footprint"
    requirement_text: >
      Disclose portfolio carbon footprint expressed as metric tonnes of CO2
      equivalent per million EUR invested (tCO2e / EUR M invested), reconciled
      against portfolio NAV and investee EVIC denominators.
    is_quantitative: true
    mandatory: true

  - req_id: "SFDR-PAI-03"
    framework: "EU_SFDR_PAI"
    standard: "EU SFDR PAI 3"
    topic: "PAI 3 — GHG Intensity of Investee Companies"
    requirement_text: >
      Disclose weighted average carbon intensity (WACI) across investee companies
      expressed in tCO2e per million EUR of investee company revenue.
    is_quantitative: true
    mandatory: true

  - req_id: "SFDR-PAI-04"
    framework: "EU_SFDR_PAI"
    standard: "EU SFDR PAI 4"
    topic: "PAI 4 — Exposure to Companies Active in the Fossil Fuel Sector"
    requirement_text: >
      Disclose the share of investments (%) in investee companies active in the
      fossil fuel sector (extraction, processing, storage, transport, or
      manufacture of solid, liquid, or gaseous fossil fuels).
    is_quantitative: true
    mandatory: true

  - req_id: "SFDR-PAI-05"
    framework: "EU_SFDR_PAI"
    standard: "EU SFDR PAI 5"
    topic: "PAI 5 — Share of Non-Renewable Energy Consumption and Production"
    requirement_text: >
      Disclose the share (%) of non-renewable energy consumption and non-renewable
      energy production of investee companies from non-renewable energy sources
      compared to renewable energy sources.
    is_quantitative: true
    mandatory: true

  - req_id: "SFDR-PAI-06"
    framework: "EU_SFDR_PAI"
    standard: "EU SFDR PAI 6"
    topic: "PAI 6 — Energy Consumption Intensity per High Impact Climate Sector"
    requirement_text: >
      Disclose energy consumption in GWh per million EUR of revenue of investee
      companies, broken down per NACE high impact climate sector (A through H
      and L).
    is_quantitative: true
    mandatory: true

  - req_id: "SFDR-PAI-07"
    framework: "EU_SFDR_PAI"
    standard: "EU SFDR PAI 7"
    topic: "PAI 7 — Activities Negatively Affecting Biodiversity-Sensitive Areas"
    requirement_text: >
      Disclose the share of investments (%) in investee companies with sites or
      operations located in or near biodiversity-sensitive areas where
      activities negatively affect those areas.
    is_quantitative: true
    mandatory: true

  - req_id: "SFDR-PAI-08"
    framework: "EU_SFDR_PAI"
    standard: "EU SFDR PAI 8"
    topic: "PAI 8 — Emissions to Water"
    requirement_text: >
      Disclose tonnes of priority pollutants and hazardous emissions to water
      generated by investee companies per million EUR invested, expressed as a
      weighted average.
    is_quantitative: true
    mandatory: true

  - req_id: "SFDR-PAI-09"
    framework: "EU_SFDR_PAI"
    standard: "EU SFDR PAI 9"
    topic: "PAI 9 — Hazardous Waste and Radioactive Waste Ratio"
    requirement_text: >
      Disclose tonnes of hazardous waste and radioactive waste generated by
      investee companies per million EUR invested, expressed as a weighted
      average.
    is_quantitative: true
    mandatory: true

  - req_id: "SFDR-PAI-10"
    framework: "EU_SFDR_PAI"
    standard: "EU SFDR PAI 10"
    topic: "PAI 10 — Violations of UN Global Compact & OECD Guidelines"
    requirement_text: >
      Disclose the share of investments (%) in investee companies that have been
      involved in violations of the UN Global Compact (UNGC) principles or the
      OECD Guidelines for Multinational Enterprises.
    is_quantitative: true
    mandatory: true

  - req_id: "SFDR-PAI-11"
    framework: "EU_SFDR_PAI"
    standard: "EU SFDR PAI 11"
    topic: "PAI 11 — Lack of UNGC / OECD Compliance Monitoring Mechanisms"
    requirement_text: >
      Disclose the share of investments (%) in investee companies without policies
      to monitor compliance with UNGC principles or OECD Guidelines or without
      grievance/complaints handling mechanisms to address violations.
    is_quantitative: true
    mandatory: true
